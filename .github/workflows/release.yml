name: Build and Release
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Verify access, prepare a draft, or publish to Marketplace and GitHub"
        required: true
        type: choice
        default: verify
        options: [verify, prepare, publish]
      version:
        description: "Required for prepare/publish; must match package.json (without v)"
        required: false
        type: string
concurrency:
  group: publishing
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify requested version
        if: inputs.operation != 'verify'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mts
  checks:
    if: inputs.operation != 'verify'
    needs: version
    uses: ./.github/workflows/lint.yml
  release:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-vsix
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "*.vsix"
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          draft: true
  publishing-access:
    if: inputs.operation == 'verify'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node scripts/check-publishing.mts
  publish:
    if: inputs.operation == 'publish'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-vsix
      - name: Publish the tested VSIX to Marketplace
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm exec vsce publish --oidc --packagePath "elfpreview-$RELEASE_VERSION.vsix"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false
