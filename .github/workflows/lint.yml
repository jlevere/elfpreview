name: Check and Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - run: nix develop --command pnpm install --frozen-lockfile
      - run: nix develop --command pnpm build
      - run: nix develop --command pnpm test
      - name: Install VS Code
        run: |
          mkdir -p "$RUNNER_TEMP/vscode"
          curl --fail --location 'https://update.code.visualstudio.com/latest/linux-x64/stable' | tar -xz --strip-components=1 -C "$RUNNER_TEMP/vscode"
      - name: Extension host tests
        env:
          VSCODE_EXECUTABLE: ${{ runner.temp }}/vscode/code
        run: xvfb-run -a nix develop --command pnpm test:extension
